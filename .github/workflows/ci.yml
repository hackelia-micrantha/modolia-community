name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality tooling
        run: python -m pip install '.[validation,test,dev]'

      - name: Static analysis
        run: |
          ruff check model_router scripts tests
          mypy model_router scripts/resolve_route.py

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Integration tests
        run: pytest -q -m integration tests/integration

      - name: Coverage gate
        run: pytest -q --cov --cov-report=term-missing tests/unit tests/integration

      - name: End-to-end tests
        run: pytest -q -m e2e tests/e2e

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Temporary release-preparation step. The artifact is reviewed and committed
      # through normal repository writes; CI retains read-only repository permission.
      - name: Generate candidate release lock
        run: nix flake lock

      - name: Upload candidate release lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate public flake
        run: nix flake show

      - name: Build public package
        run: nix build .#modolia --print-build-logs

      - name: Check installed CLI help
        run: nix run .#modolia -- --help

      - name: Check installed CLI version
        run: test "$(nix run .#modolia -- --version)" = "modolia 0.1.0 (resolver 0.1.0)"

      - name: Check installed CLI route
        run: |
          nix run .#modolia -- \
            examples/route-request.json \
            examples/route-constraints.json \
            --registry examples/model-surfaces.yaml \
            > decision.json
          test -s decision.json

      - name: Build declared CLI contract
        run: nix build .#checks.x86_64-linux.executable --print-build-logs

      - name: Run Nix static analysis contract
        run: nix build .#checks.x86_64-linux.static-analysis --print-build-logs

      - name: Run Nix unit contract
        run: nix build .#checks.x86_64-linux.unit --print-build-logs

      - name: Run Nix integration contract
        run: nix build .#checks.x86_64-linux.integration --print-build-logs

      - name: Run Nix coverage contract
        run: nix build .#checks.x86_64-linux.coverage --print-build-logs

      - name: Run Nix end-to-end contract
        run: nix build .#checks.x86_64-linux.e2e --print-build-logs

      - name: Validate complete public flake
        run: nix flake check --print-build-logs
