[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modolia"
version = "0.1.0"
description = "Deterministic, host-independent model-surface resolution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.18,<5", "PyYAML>=6,<7"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
dev = ["mypy>=1.16,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["model_router*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
markers = [
  "integration: exercises multiple Modolia components together",
  "e2e: exercises a user-visible command as a black box",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["model_router", "scripts/resolve_route.py"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["model_router"]

[tool.coverage.report]
fail_under = 75
show_missing = true
